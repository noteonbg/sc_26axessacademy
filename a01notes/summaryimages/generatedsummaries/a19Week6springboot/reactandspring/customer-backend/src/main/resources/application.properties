server.port=4500

# H2 File-Based Local Database Configuration (Stored in project ./data folder)
spring.datasource.url=jdbc:h2:file:./data/bankdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console Configuration (http://localhost:4500/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Hibernate SQL formatting
spring.jpa.properties.hibernate.format_sql=true
