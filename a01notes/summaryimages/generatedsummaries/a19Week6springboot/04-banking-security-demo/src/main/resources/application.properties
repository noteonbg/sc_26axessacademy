# Topic 4: Spring Security Architecture Demo Configuration
spring.application.name=banking-security-demo
server.port=8084

# H2 Database Setup
spring.datasource.url=jdbc:h2:mem:bankingsecdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.headers.frame-options=sameorigin

# Security Debug Logging
logging.level.org.springframework.security=DEBUG
