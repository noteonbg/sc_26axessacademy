# Application Configuration (Java 21 OpenJDK Core Banking App)
spring.application.name=banking-core-app
server.port=8080

# H2 File-Based Local Database Configuration (Stored in project ./data folder for persistence)
spring.datasource.url=jdbc:h2:file:./data/bankingdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# PostgreSQL Configuration (Uncomment for production setup)
# spring.datasource.url=jdbc:postgresql://localhost:5432/CoreBankingDB
# spring.datasource.username=postgres
# spring.datasource.password=SecureBankPass2026!
# spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# For PostgreSQL use: org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Enable Security H2 console access
spring.headers.frame-options=sameorigin
