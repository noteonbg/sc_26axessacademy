# =========================================================================
# Standard Chartered Axess Academy - Week 7 Performance Testing POC
# Target Endpoint: http://localhost:3000/sc_employees
# =========================================================================
#
# WHY THIS FILE EXISTS:
# ---------------------
# This file configures Spring Boot's internal runtime environment. Under high
# performance testing load (50 concurrent users), default server configurations
# can cause socket queueing or thread starvation. This file configures Tomcat
# and Actuator to handle high-concurrency traffic cleanly.

# 1. SERVER PORT CONFIGURATION
# Matches the exact URL specified in slide 14 Handson 1: http://localhost:3000/sc_employees
server.port=3000

# 2. EMBEDDED TOMCAT THREAD POOL CONFIGURATION
# WHY: When 50 virtual users send requests simultaneously, Tomcat dispatches each connection
# to an available thread from this pool.
# server.tomcat.threads.max: Maximum number of worker threads Tomcat will spawn.
# Default is 200, which easily accommodates 50 concurrent JMeter threads.
server.tomcat.threads.max=200

# server.tomcat.threads.min-spare: Minimum number of idle worker threads always kept alive.
# Having 20 idle threads eliminates cold-start thread creation latency when load ramps up.
server.tomcat.threads.min-spare=20

# server.tomcat.accept-count: Maximum queue length for incoming connection requests
# when all possible request processing threads are in use.
server.tomcat.accept-count=100

# server.tomcat.connection-timeout: Time in ms before Tomcat closes an idle connection.
server.tomcat.connection-timeout=20000

# 3. SPRING BOOT ACTUATOR MONITORING ENDPOINTS
# WHY: Allows monitoring server health, JVM memory, and active threads during load testing.
# Exposes /actuator/health, /actuator/info, and /actuator/metrics
management.endpoints.web.exposure.include=health,info,metrics

# Displays detailed component status (diskSpace, ping) in /actuator/health
management.endpoint.health.show-details=always

# 4. APPLICATION IDENTIFIER
spring.application.name=sc-employees-service
