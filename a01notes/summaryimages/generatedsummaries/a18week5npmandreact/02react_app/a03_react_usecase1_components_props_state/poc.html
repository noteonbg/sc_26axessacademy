<!DOCTYPE html>
<html>
<head>
  <title>Counter Example</title>
</head>
<body>

  <h2>Open the console to see the output</h2>

  <script>

    //ramesh does this
    function useCounter(initialValue = 0) {
      const country = { value: initialValue };

      function setHorrible(newValue) {
        console.log("function assingment will not leave it... it follow me");
        country.value = newValue;
        console.log("Updated count:", country.value);
      }

      return [country, setHorrible];
    }


    //suresh does this we are permannently suresh most of times
    // Destructure with initial value
    const [counter, updateCounter] = useCounter(10);




    console.log("Initial count:", counter.value); // 10

    updateCounter(25); // Updated count: 25

    console.log("Final count:", counter.value); // 25
  </script>

</body>
</html>
