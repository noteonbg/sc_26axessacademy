<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Array Manager - Presentation Use Case (Slide 26)</title>
    <style>
        :root {
            --primary: #0072ce;
            --primary-dark: #00569e;
            --dark: #1e293b;
            --border: #cbd5e1;
            --light: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            color: var(--dark);
            margin: 0;
            padding: 30px 20px;
        }

        .card-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        h2 {
            color: var(--primary);
            margin-top: 0;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            font-size: 1.6rem;
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .form-row label {
            width: 140px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #475569;
        }

        .form-row input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .form-row input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,114,206,0.15);
        }

        .btn-group {
            margin-left: 140px;
            margin-top: 20px;
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
        }

        .btn-submit:hover {
            background-color: var(--primary-dark);
        }

        .btn-display {
            background-color: #0284c7;
            color: white;
        }

        .btn-display:hover {
            background-color: #0369a1;
        }

        .output-box {
            margin-top: 25px;
            background: #0f172a;
            color: #38bdf8;
            font-family: 'Consolas', monospace;
            padding: 18px;
            border-radius: 8px;
            word-break: break-all;
            display: none;
            font-size: 0.9rem;
            border-left: 4px solid var(--primary);
        }

        .status-pill {
            background: #dcfce7;
            color: #15803d;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="card-container">
    <h2>Presenting the Use case on JSON</h2>
    <p style="color: #64748b; font-size: 0.95rem;">PDF Slide 26 Specification — Built with Pure Vanilla CSS (No Frameworks/Libraries)</p>

    <form id="jsonForm">
        <div class="form-row">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" placeholder="Enter First Name" required>
        </div>

        <div class="form-row">
            <label for="secondName">Second Name:</label>
            <input type="text" id="secondName" placeholder="Enter Second Name" required>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-submit">Submit</button>
            <button type="button" id="displayBtn" class="btn btn-display">Display JSON Data</button>
        </div>
    </form>

    <div id="statusNotice" class="status-pill" style="display:none;"></div>

    <div id="jsonDisplay" class="output-box"></div>
</div>

<script>
    'use strict';

    // JSON Array storing submitted user objects (Pre-populated sample data matching PDF slide 26)
    const jsonEntries = [
        { FirstName: "Sandra", LastName: "Rogers" },
        { FirstName: "Steve", LastName: "Casey" },
        { FirstName: "Michelle", LastName: "Michaels" }
    ];

    const form = document.getElementById("jsonForm");
    const firstNameInput = document.getElementById("firstName");
    const secondNameInput = document.getElementById("secondName");
    const displayBtn = document.getElementById("displayBtn");
    const outputBox = document.getElementById("jsonDisplay");
    const statusNotice = document.getElementById("statusNotice");

    // Submit Event: Save entries into JSON array
    form.addEventListener("submit", function (e) {
        e.preventDefault();

        const fName = firstNameInput.value.trim();
        const sName = secondNameInput.value.trim();

        if (fName && sName) {
            // Push entry as object into array
            jsonEntries.push({
                FirstName: fName,
                LastName: sName
            });

            // Feedback notice
            statusNotice.style.display = "inline-block";
            statusNotice.textContent = `✓ Entry for '${fName} ${sName}' saved to JSON array! (Total: ${jsonEntries.length})`;

            // Clear inputs
            firstNameInput.value = "";
            secondNameInput.value = "";
            firstNameInput.focus();
        }
    });

    // Display Button Event: Display serialized JSON array string
    displayBtn.addEventListener("click", function () {
        outputBox.style.display = "block";
        
        // Convert JS array to JSON string representation
        const jsonString = JSON.stringify(jsonEntries);
        outputBox.textContent = jsonString;
    });
</script>

</body>
</html>
