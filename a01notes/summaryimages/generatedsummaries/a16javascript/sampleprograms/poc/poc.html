function checkCreditApproval(creditScore) {
    return new Promise((ps, pf) => {
        console.log(`[Credit System] Verifying score (${creditScore})... Please wait...`);
        setTimeout(() => {
            if (creditScore >= 700) {
                console.log("taking time to print approval");
                ps(23);
            } else {
                console.log("taking time to print denial");
                pf("Credit Denied! Your score is below the required threshold.");
            }
        }, 2000);
    });
}
