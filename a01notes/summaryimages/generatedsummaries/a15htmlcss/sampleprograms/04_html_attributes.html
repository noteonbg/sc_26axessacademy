<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>04 - HTML Attributes Demo</title>
    <style>
        #unique-header { background-color: #0055a5; color: white; padding: 15px; border-radius: 4px; }
        .group-item { color: #d32f2f; font-weight: bold; background: #ffebee; padding: 8px; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>04. HTML Attributes Demonstration</h1>

    <!-- 1. Unique ID Attribute -->
    <h2 id="unique-header" title="Hover Tooltip: Unique Header ID">Header Element with Unique ID (#unique-header)</h2>

    <!-- 2. Shared Class Attribute -->
    <p class="group-item">Paragraph 1 sharing the .group-item class.</p>
    <p class="group-item">Paragraph 2 sharing the .group-item class.</p>

    <!-- 3. Image Attributes: src, alt, width, height, title -->
    <h3>Image Attributes:</h3>
    <img src="https://via.placeholder.com/200x100" alt="Placeholder Demo Image" width="200" height="100" title="Placeholder Image Hover Tooltip">
</body>
</html>
