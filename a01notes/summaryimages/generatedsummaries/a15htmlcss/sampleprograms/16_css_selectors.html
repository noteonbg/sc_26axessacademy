<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>16 - CSS Selectors</title>
    <style>
        /* 1. Universal Selector */
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* 2. Element Selector */
        p {
            color: #333333;
            line-height: 1.5;
        }

        /* 3. Class Selector */
        .c1 {
            color: red;
            font-weight: bold;
        }

        /* 4. ID Selector */
        #id1 {
            background-color: yellow;
            padding: 10px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>16. CSS Selectors (Element, Class, ID, Universal)</h1>

    <h2 id="id1">Header Styled via ID Selector (#id1)</h2>
    <p>Standard paragraph styled via Element Selector (p).</p>
    <p class="c1">Paragraph styled via Class Selector (.c1).</p>
</body>
</html>
