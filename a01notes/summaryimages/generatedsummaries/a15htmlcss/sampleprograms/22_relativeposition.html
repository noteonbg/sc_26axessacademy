<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    /* PARENT CONTAINER */
    .parent-card {
      position: relative; /* Serves as the positioning reference for absolute children */
      width: 400px;
      height: 300px;
      background-color: #f8fafc;
      border: 2px solid #cbd5e1;
      margin: 60px auto;
      padding: 10px;
    }

    /* 1. H1 - RELATIVE POSITIONING */
    h1 {
      position: relative;
      
      /* RELATIVE TO: Its OWN original spot in normal document flow */
      top: 15px;   /* Shifted 15px DOWN from where <h1> would naturally be */
      left: 30px;  /* Shifted 30px RIGHT from where <h1> would naturally be */
      
      font-size: 24px;
      color: #2563eb; /* Blue */
      margin: 0;
    }

    /* 2. H2 - ABSOLUTE POSITIONING */
    h2 {
      position: absolute;
      
      /* RELATIVE TO: The <div class="parent-card"> tag */
      bottom: 20px; /* Locked 20px ABOVE the bottom border of .parent-card */
      right: 20px;  /* Locked 20px INSIDE the right border of .parent-card */
      
      font-size: 20px;
      color: #dc2626; /* Red */
      margin: 0;
    }

    /* 3. H3 - FIXED POSITIONING */
    h3 {
      position: fixed;
      
      /* RELATIVE TO: The Browser Window (Viewport / <html> tag) */
      top: 10px;   /* Locked 10px from the TOP of the entire browser screen */
      right: 10px; /* Locked 10px from the RIGHT of the entire browser screen */
      
      font-size: 16px;
      background-color: #16a34a; /* Green */
      color: white;
      padding: 8px 12px;
      margin: 0;
    }
  </style>
</head>
<body>

  <!-- Parent wrapper with position: relative -->
  <div class="parent-card">

    <!-- Point 1: Relative Heading -->
    <h1>h1 Heading (Relative)</h1>

    <!-- Point 2: Absolute Heading -->
    <h2>h2 Heading (Absolute)</h2>

  </div>

  <!-- Point 3: Fixed Heading -->
  <h3>h3 Heading (Fixed Banner)</h3>

</body>
</html>


<!--

Step-by-Step Breakdown
Point 1: <h1> with position: relative

Relative to: Itself (<h1>) — specifically, the exact default spot where it
     would naturally render inside .parent-card.

What happens: The top: 15px and left: 30px rules push <h1> down and right away 
    from its starting position. Crucially, it still reserves its original space in
     the document flow, meaning any element following it respects that blank space.

Point 2: <h2> with position: absolute

Relative to: <div class="parent-card"> — the nearest parent element with position defined (relative).

What happens: It is completely pulled out of normal flow (no space is reserved for it).
 Setting bottom: 20px and right: 20px pins it directly to the bottom-right corner of .parent-card.
  If .parent-card did not have position: relative, <h2> would look further up the tree until it hit
     <body>/<html>.

Point 3: <h3> with position: fixed
Relative to: The Browser Window (Viewport / <html>) — ignoring all parent containers completely,
     including .parent-card.

What happens: It is removed from flow and pinned to top: 10px and right: 10px of the visible screen. 
Even if you scroll down a 5,000-pixel page, <h3> stays frozen in that exact spot on your screen like a sticky notification.


Normal Flow.

If **no positioning** were used on any of the tags (meaning all tags default to `position: static`), 
here is exactly how the browser would render them in normal document flow:

---

### Key Rules of Normal Flow

1. **Block-Level Stacking:** Heading tags (`<h1>`, `<h2>`, `<h3>`) and `<div>` elements are all **block-level elements**. They automatically take up 100% of the available width of their parent container and stack vertically from top to bottom.
2. **Margin Collapsing:** Top and bottom margins of adjacent vertical elements collapse together into a single margin equal to the larger of the two.
3. **In-Flow Layout:** Every element occupies physical space on the page. Subsequent elements are pushed down below the previous element's bottom edge.

---

### Step-by-Step Layout Without Positioning

#### 1. `<div class="parent-card">`

* Renders centered on the screen with a width of `400px` and height of `300px`.
* Acts as the container box holding any children placed inside its HTML tags.

#### 2. `<h1> Heading (Relative)`

* Sits at the **very top-left corner** of `.parent-card` (accounting for the 10px inner padding of `.parent-card`).
* It takes up the full width inside `.parent-card` and forces the next element (`<h2>`) to sit directly below it.
* Without `top: 15px` or `left: 30px`, it does not shift; it stays cleanly aligned to the top-left edge.

#### 3. `<h2> Heading (Absolute)`

* Sits **directly below `<h1>**` in normal vertical order.
* Because it is no longer `absolute`, it is **NOT** pulled out of flow. It stays inside the standard reading flow near the top of `.parent-card`, rather than floating down to the bottom-right corner.

#### 4. `<h3> Heading (Fixed Banner)`

* Sits **outside and below `<div class="parent-card">**`, at the bottom of the HTML file.
* Because it is no longer `fixed`, it loses its sticky behavior on the browser screen. It renders below `.parent-card` as a normal page heading and **scrolls up and down with the rest of the page**.

---

### Comparison Summary

```
WITH POSITIONING:                       WITHOUT POSITIONING (Normal Flow):
+-----------------------------------+   +-----------------------------------+
| [h3 Fixed Banner at Top Window]   |   | .parent-card                      |
|                                   |   |  <h1> Heading 1                   |
| .parent-card                      |   |  <h2> Heading 2                   |
|  [h1 shifted down/right]          |   |  (empty space down to 300px)      |
|                                   |   +-----------------------------------+
|                   [h2 Abs Bottom] |   | <h3> Heading 3 (below card)       |
+-----------------------------------+   +-----------------------------------+

The 3 Rules of position: static
Ignores Offset Properties: top, bottom, left, right, and z-index have zero effect.
 Setting top: 50px on a static element does nothing.

Preserves Space: Every static element occupies its own space on the page and pushes subsequent elements down
 or to the side.

Cannot Act as an Anchor: A static parent element cannot serve as a reference point for a
 child element that uses position: absolute.
