<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>11 - HTML5 Form Input Types</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-group { margin-bottom: 12px; }
        label { display: inline-block; width: 160px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>11. Specialized HTML5 Form Input Types</h1>

    <form>
        <div class="form-group">
            <label for="color">Color Picker:</label>
            <input type="color" id="color" name="color" value="#0055a5">
        </div>
        <div class="form-group">
            <label for="date">Date:</label>
            <input type="date" id="date" name="date">
        </div>
        <div class="form-group">
            <label for="datetime">Datetime-Local:</label>
            <input type="datetime-local" id="datetime" name="datetime">
        </div>
        <div class="form-group">
            <label for="time">Time:</label>
            <input type="time" id="time" name="time">
        </div>
        <div class="form-group">
            <label for="week">Week:</label>
            <input type="week" id="week" name="week">
        </div>
        <div class="form-group">
            <label for="month">Month:</label>
            <input type="month" id="month" name="month">
        </div>
        <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="user@example.com">
        </div>
        <div class="form-group">
            <label for="number">Number (1-10):</label>
            <input type="number" id="number" name="number" min="1" max="10" value="1">
        </div>
        <div class="form-group">
            <label for="range">Range Slider (0-100):</label>
            <input type="range" id="range" name="range" min="0" max="100" value="50">
        </div>
    </form>
</body>
</html>
