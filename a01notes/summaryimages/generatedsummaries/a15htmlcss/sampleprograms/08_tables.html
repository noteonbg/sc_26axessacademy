<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>08 - HTML Tables</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #0055a5; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>08. HTML Table Structure (&lt;table&gt;, &lt;tr&gt;, &lt;th&gt;, &lt;td&gt;)</h1>

    <table>
        <thead>
            <tr>
                <th>S.No</th>
                <th>Employee Name</th>
                <th>Designation</th>
                <th>City</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>John Doe</td>
                <td>Web Developer</td>
                <td>Bangalore</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Jane Smith</td>
                <td>UI/UX Designer</td>
                <td>Chennai</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Robert Johnson</td>
                <td>System Analyst</td>
                <td>Mysore</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
