<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>19 - CSS Font Properties</title>
    <style>
        .font-demo-1 {
            font-family: "Georgia", Times, serif;
            font-size: 22px;
            font-style: italic;
            font-weight: bold;
        }
        .font-demo-2 {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            font-weight: 700;
            font-variant: small-caps;
        }
    </style>
</head>
<body>
    <h1>19. CSS Font Properties</h1>

    <p class="font-demo-1">Georgia Font Family: Size 22px, Italic, and Bold.</p>
    <p class="font-demo-2">Arial Font Family: Size 16px, Weight 700, and Small-Caps Variant.</p>
</body>
</html>
