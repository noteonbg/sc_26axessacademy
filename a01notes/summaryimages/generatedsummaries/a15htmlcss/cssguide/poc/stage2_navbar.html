<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage 2 - Sticky Navigation Bar</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stage2_style.css">
</head>
<body>

    <!-- 
      STAGE 2: STICKY NAVIGATION HEADER
      Added complete nav components:
      1. Home SVG Icon Button
      2. Location selector ("You're in India ▾")
      3. Menu Links ("Our Products", "Promotions", "Services", "Help")
      4. Search icon button
      5. Green Login button
      6. Standard Chartered brand logo
    -->

    <header class="navbar">
        <div class="nav-left">
            <!-- Home Icon -->
            <a href="#" class="home-btn" title="Home">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </a>

            <!-- Location Selector -->
            <div class="location-picker">
                You're in <span class="country">India <small>▼</small></span>
            </div>

            <!-- Menu Links -->
            <nav class="nav-menu">
                <ul>
                    <li><a href="#">Our Products</a></li>
                    <li><a href="#">Promotions</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Help</a></li>
                </ul>
            </nav>

            <!-- Search Icon -->
            <button class="search-btn" title="Search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </div>

        <div class="nav-right">
            <!-- Green Login Button -->
            <a href="#" class="btn-login">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                LOGIN
            </a>

            <!-- Logo -->
            <div class="brand-logo">
                <span class="logo-text">Standard<br>Chartered</span>
                <svg width="32" height="32" viewBox="0 0 100 100">
                    <path d="M20 70 C40 90, 70 80, 80 50 C90 20, 60 10, 40 30 C30 40, 20 60, 20 70" fill="none" stroke="#00a859" stroke-width="14" stroke-linecap="round"/>
                    <path d="M30 30 C50 10, 80 20, 70 50 C60 80, 30 90, 20 70" fill="none" stroke="#0055a5" stroke-width="14" stroke-linecap="round"/>
                </svg>
            </div>
        </div>
    </header>

    <main>
        <section class="hero-section">
            <p style="padding: 100px; text-align: center;">[Scroll down to test Sticky Header Navbar behavior]</p>
            <div style="height: 1000px; background: #edf2f7; margin: 20px; padding: 20px; text-align: center;">
                Scroll content testing sticky navbar at top=0...
            </div>
        </section>
    </main>

</body>
</html>
