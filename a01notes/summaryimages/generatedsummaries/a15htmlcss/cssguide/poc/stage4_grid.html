<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage 4 - 5-Column Grid Layout</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stage4_style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-left">
            <div class="location-picker">You're in <span class="country">India ▼</span></div>
            <nav class="nav-menu"><ul><li><a href="#">Our Products</a></li><li><a href="#">Promotions</a></li></ul></nav>
        </div>
        <div class="nav-right">
            <a href="#" class="btn-login">LOGIN</a>
        </div>
    </header>

    <!-- 
      STAGE 4: 5-COLUMN CSS GRID CONTAINER
      Added <div class="card-grid"> containing 5 placeholder card blocks.
    -->
    <main>
        <section class="hero-section">
            <h1 class="hero-title">Welcome to Standard Chartered</h1>

            <!-- 5-Column Grid Layout -->
            <div class="card-grid">
                <div class="grid-card-placeholder">Grid Column 1</div>
                <div class="grid-card-placeholder">Grid Column 2</div>
                <div class="grid-card-placeholder">Grid Column 3</div>
                <div class="grid-card-placeholder">Grid Column 4</div>
                <div class="grid-card-placeholder">Grid Column 5</div>
            </div>
        </section>
    </main>

</body>
</html>
